name: Publicar paquete compacto
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sustituir archivos públicos
        shell: bash
        run: |
          base64 -d .privacy/package.b64 > /tmp/privacy-package.zip
          unzip -o /tmp/privacy-package.zip -d .
          rm -rf .privacy
          rm -f .github/workflows/publish-privacy.yml
          rm -f .github/workflows/publish-package.yml
      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: protect candidate personal data"
          git push
